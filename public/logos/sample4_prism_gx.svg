<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Indigo to Purple Gradient -->
    <linearGradient id="primaryGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Warm Golden Amber Accent Gradient -->
    <linearGradient id="accentGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Cyan Highlight Gradient -->
    <linearGradient id="cyanGrad4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>

    <filter id="glow4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad4)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="130" fill="#6366f1" opacity="0.18" filter="url(#glow4)" />

  <!-- Stylized Monogram "G" + Note Fold + Dynamic Stylus/Arrow -->
  <g filter="url(#shadow4)" transform="translate(256, 256)">
    <!-- Main Outer Curving C-Ring of the "G" -->
    <path d="M -40,-130 
             C 65,-130 135,-65 135,30 
             C 135,120 70,145 -10,145 
             C -95,145 -145,95 -145,-5 
             C -145,-85 -95,-130 -40,-130 Z" 
          fill="none" 
          stroke="url(#primaryGrad4)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Folded Note Paper Corner (Top Right) -->
    <path d="M 40,-130 L 125,-130 L 40,-45 Z" fill="url(#accentGrad4)" opacity="0.95" />
    <path d="M 40,-45 L 125,-130 L 125,-45 Z" fill="#b45309" opacity="0.4" />

    <!-- Dynamic "X" & Stylus Crossbar penetrating into G center -->
    <path d="M -35,-20 L 120,85" stroke="url(#cyanGrad4)" stroke-width="36" stroke-linecap="round" />
    <path d="M 115,-15 L -20,80" stroke="url(#accentGrad4)" stroke-width="32" stroke-linecap="round" />
    
    <!-- Central Pen Nib / Star Sparkle -->
    <circle cx="50" cy="32" r="14" fill="#ffffff" filter="url(#glow4)" />
  </g>
</svg>
