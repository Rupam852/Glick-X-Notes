<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Emerald to Electric Cyan Gradient -->
    <linearGradient id="cyanMint6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Deep Royal Indigo Gradient -->
    <linearGradient id="royalIndigo6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>

    <filter id="glow6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Container Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad6)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2" />

  <!-- Background Cyan Ambient Glow -->
  <circle cx="256" cy="256" r="130" fill="#06b6d4" opacity="0.14" filter="url(#glow6)" />

  <g filter="url(#shadow6)" transform="translate(256, 256)">
    <!-- Base Note Document Sheet Layer (Angled back) -->
    <rect x="-105" y="-120" width="180" height="230" rx="28" fill="url(#royalIndigo6)" transform="rotate(-8)" opacity="0.65" />

    <!-- Front Note Document Sheet with folded corner forming 'G' -->
    <rect x="-90" y="-110" width="180" height="230" rx="28" fill="url(#cyanMint6)" />
    
    <!-- Cutout / Masking that carves the document into an iconic 'G' -->
    <!-- Inner document cutout -->
    <rect x="-45" y="-65" width="90" height="120" rx="16" fill="#090d16" />
    <!-- Horizontal crossbar for 'G' and 'X' intersection -->
    <rect x="-15" y="-10" width="95" height="34" rx="17" fill="url(#cyanMint6)" />

    <!-- Folded top-right paper corner (Origami dog-ear) -->
    <path d="M 50,-110 L 90,-70 L 50,-70 Z" fill="#ffffff" opacity="0.9" />

    <!-- Dynamic Stylus Line crossing downward across the page creating 'X' -->
    <line x1="-120" y1="-70" x2="120" y2="110" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.85" />
    <!-- Glowing tip -->
    <circle cx="120" cy="110" r="10" fill="#ffffff" filter="url(#glow6)" />
  </g>
</svg>
