<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png?v=5">
    <title>Glick X Notes</title>
    <script>
      (function() {
        if (window.location.hostname.includes('vercel.app')) {
          window.__IS_VERCEL_REDIRECT__ = true;
          var targetUrl = 'https://glick-x-notes.pages.dev' + window.location.pathname + window.location.search + window.location.hash;
          var count = 5;
          document.addEventListener('DOMContentLoaded', function() {
            document.body.innerHTML = `
              <div style="background-color:#0b0f19;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;">
                <div style="background:#111827;border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:40px 28px;max-width:480px;width:100%;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);">
                  <div style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:9999px;font-size:12px;font-weight:700;background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.3);margin-bottom:20px;letter-spacing:0.5px;text-transform:uppercase;">
                    🚀 Faster Server Live
                  </div>
                  <h1 style="font-size:24px;font-weight:800;color:#ffffff;margin-bottom:12px;letter-spacing:-0.5px;">Our Official Website Has Moved</h1>
                  <p style="color:#94a3b8;font-size:14px;line-height:1.6;margin-bottom:24px;">
                    Humari official website ab naye aur ultra-fast Cloudflare server par shift ho chuki hai. Please visit:
                    <br><br>
                    <a href="${targetUrl}" style="color:#38bdf8;font-weight:600;text-decoration:none;word-break:break-all;font-size:15px;">https://glick-x-notes.pages.dev</a>
                  </p>
                  <a href="${targetUrl}" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 24px;border-radius:14px;font-size:15px;font-weight:700;color:#ffffff;background:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%);text-decoration:none;box-shadow:0 10px 25px -5px rgba(59,130,246,0.5);box-sizing:border-box;">
                    <span>Visit New Official Website</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                  </a>
                  <div style="margin-top:20px;font-size:13px;color:#64748b;">
                    Redirecting automatically in <strong id="countdown" style="color:#38bdf8;">5</strong> seconds...
                  </div>
                </div>
              </div>
            `;
            var timer = setInterval(function() {
              count--;
              var el = document.getElementById('countdown');
              if (el) el.textContent = count;
              if (count <= 0) {
                clearInterval(timer);
                window.location.replace(targetUrl);
              }
            }, 1000);
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
